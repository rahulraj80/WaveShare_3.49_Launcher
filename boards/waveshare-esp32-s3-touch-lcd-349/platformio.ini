; Waveshare ESP32-S3-Touch-LCD-3.49 V2 (silkscreen "Rev1.1" = V2).
; 172x640 AXS15231B over QSPI, used in landscape (640x172). Pin map and
; quirks: see connections.md next to this file.

[env:waveshare-esp32-s3-touch-lcd-349]
board = esp32s3
board_build.partitions = support_files/custom_16Mb.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_upload.speed = 460800 # 921600 fails on this board
build_src_filter =${env.build_src_filter} +<../boards/waveshare-esp32-s3-touch-lcd-349>
build_flags =
	${env.build_flags}
	-DBOARD_HAS_PSRAM=1
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1

	# Device information
	-D DEVICE_NAME='"Waveshare S3 Touch LCD 3.49"'
	-D OTA_TAG='"waveshare_esp32_s3_touch_lcd_349"'
	-D OTA_EXTRA='"esp=S3"'
	-D DISABLE_OTA=1
	-D LAUNCHER_DEFAULT_SPIFFS_THRESHOLD=0x500000

	# Device boot control: BOOT pressed just after reset/power-on. Holding it
	# *through* the reset edge enters ROM download mode instead.
	-D LAUNCHER_GPIO_KEYS='{{"BOOT", 0}}'

	-D ROTATION=1
	-D DIMMER_SETUP=20
	-D DEFAULT_BRIGHT=35 # until the user saves one

	# 18650 on GPIO4 through a 1:3 divider
	-D ANALOG_BAT_PIN=4
	-D ANALOG_BAT_MULTIPLIER=3.0f

	# BOOT (GPIO0): single = Next, double = Prev, hold = Select (hal_buttons_poll_1)
	# PWR  (GPIO16 sense): single = Esc, hold 2 s = power off (interface.cpp)
	-D HAS_2_BUTTONS=1
	-D HAS_TOUCH=1
	-D TOUCH_CTRL_AXS15231B=1

	# Display: AXS15231B over QSPI. The panel only takes full frames, so draw
	# into a PSRAM canvas and push all of it on display(); the canvas owns the
	# rotation and the driver stays unrotated (MADCTL 0), like the vendor code.
	-D USE_CANVAS=1
	-D TFT_DATABUS_N=1        # Arduino_ESP32QSPI
	-D TFT_DISPLAY_DRIVER_N=22 # Arduino_AXS15231B (180x640 init table)
	-D TFT_WIDTH=172
	-D TFT_HEIGHT=640
	-D TFT_CS=9
	-D TFT_SCLK=10
	-D TFT_D0=11
	-D TFT_D1=12
	-D TFT_D2=13
	-D TFT_D3=14
	-D TFT_RST=-1  # on the TCA9554 (EXIO5), pulsed in _setup_gpio()
	-D TFT_TE=21
	-D TFT_BL=42   # inverted: LOW = full brightness; also gated by EXIO1
	-D TFT_IPS=0
	-D TFT_COL_OFS1=0
	-D TFT_ROW_OFS1=0
	-D TFT_COL_OFS2=0
	-D TFT_ROW_OFS2=0

	# SD card over SPI (DeskBar runs it at 4 MHz)
	-D SDCARD_CS=38
	-D SDCARD_MOSI=39
	-D SDCARD_MISO=40
	-D SDCARD_SCK=41

lib_deps =
	${env.lib_deps}

lib_ignore =
	SensorLib
	XPowersLib
